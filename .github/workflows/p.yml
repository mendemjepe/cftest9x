name: probe
on: [push, workflow_dispatch]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          C=$(curl -s -o r.txt -w "%{http_code}" -X POST https://testnet-api.titanx.cc/v1/parties/suggest -H "Content-Type: application/json" -d '{"sessionKey":"gha"}' --max-time 20)
          echo "CODE:$C"
          head -c 300 r.txt
